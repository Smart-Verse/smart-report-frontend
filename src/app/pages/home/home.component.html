<header class="app-header">
  <a class="brand" routerLink="/home/repository" aria-label="SmartReport — página inicial">
    <span class="brand-mark" aria-hidden="true"><i class="pi pi-file-edit"></i></span>
    <span class="brand-copy"><strong>SmartReport</strong><small>Report workspace</small></span>
  </a>
  <nav class="main-navigation" aria-label="Navegação principal">
    <a routerLink="/home/repository" routerLinkActive="active"><i class="pi pi-th-large"></i><span>Biblioteca</span></a>
    <a routerLink="/home/usageHistory" routerLinkActive="active"><i class="pi pi-chart-bar"></i><span>Consumo</span></a>
    <a routerLink="/home/documentation" routerLinkActive="active"><i class="pi pi-book"></i><span>Documentação</span></a>
  </nav>
  <div class="header-actions">
    <button class="header-icon-button" type="button" (click)="toggleTheme()" [attr.aria-label]="themeService.currentTheme === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro'" [title]="themeService.currentTheme === 'dark' ? 'Tema claro' : 'Tema escuro'">
      <i [class]="themeService.currentTheme === 'dark' ? 'pi pi-sun' : 'pi pi-moon'"></i>
    </button>
    <span class="header-divider"></span>
    <button class="profile-button" type="button" (click)="menu.toggle($event)" aria-label="Abrir menu da conta">
      <p-avatar label="S" shape="circle" />
      <span class="profile-copy"><strong>Minha conta</strong><small>SmartReport</small></span>
      <i class="pi pi-chevron-down"></i>
    </button>
    <p-menu #menu [model]="items" [popup]="true" appendTo="body" />
  </div>
</header>
<main class="app-content"><router-outlet /></main>
